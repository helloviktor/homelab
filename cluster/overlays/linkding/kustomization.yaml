apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: linkding

resources:
  - networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: linkding-secrets
    envs:
      - .env

helmCharts:
  - name: linkding
    repo: https://helloviktor.github.io/charts
    version: 0.1.0
    releaseName: linkding
    namespace: linkding
    valuesInline:
      secret:
        create: false
        name: linkding-secrets
      # Set ingressRoute.host before deployment (for example: your-domain.example).
