apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: databases

resources:
  - namespace.yaml
  - networkpolicy.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: postgres-init-script
    files:
      - scripts/01-init.sh

secretGenerator:
  - name: postgres-secrets
    envs:
      - .env

helmCharts:
  - name: postgres
    repo: https://helloviktor.github.io/charts
    version: 0.3.0
    releaseName: postgres
    namespace: databases
    valuesInline:
      secret:
        create: false
        name: postgres-secrets
      initScriptConfigMap: postgres-init-script
