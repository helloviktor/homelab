global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "traefik-metrics"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["traefik-metrics.kube-system.svc.cluster.local:9100"]
  - job_name: "cloudflared-metrics"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["cloudflared.edge.svc.cluster.local"]
