apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

secretGenerator:
  - name: postgres-secrets
    envs:
      - .env

configMapGenerator:
  - name: postgres-scripts
    files:
      - scripts/01-init-script.sh

generatorOptions:
  disableNameSuffixHash: true

resources:
  - deployment.yaml
  - service.yaml
