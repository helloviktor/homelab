apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: miniflux

images:
  - name: miniflux
    newName: miniflux/miniflux
    newTag: 2.2.16-distroless

secretGenerator:
  - name: miniflux-secrets
    envs:
      - .env

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
