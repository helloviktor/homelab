apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniflux
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`playground.hefler.dev`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      services:
        - kind: Service
          name: miniflux
          passHostHeader: true
          port: 80
      middlewares:
        - name: rate-limit
