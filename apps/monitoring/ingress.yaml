apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: monitor
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`monitor.hefler.dev`)
      observability:
        accessLogs: true
        metrics: true
        tracing: true
      services:
        - kind: Service
          name: grafana
          passHostHeader: true
          port: 3000
